media:

  input: .

  output: /

content:

  - name: home

    label: Home Page

    type: file

    path: site.json

    format: json

    fields:

      - name: brand

        label: Brand

        type: string

      - name: hero

        label: Hero

        type: object

        fields:

          - name: eyebrow

            label: Small heading

            type: string

          - name: title

            label: Main title

            type: string

          - name: emphasis

            label: Emphasis

            type: string

          - name: text

            label: Intro text

            type: text

          - name: image

            label: Hero image

            type: image

      - name: idea

        label: The Idea

        type: object

        fields:

          - name: label

            type: string

          - name: title

            type: string

          - name: paragraphs

            type: text

            list: true

      - name: statement

        label: Experience Statement

        type: object

        fields:

          - name: label

            type: string

          - name: title

            type: string

          - name: emphasis

            type: string

          - name: text

            type: text

      - name: opportunities

        label: Opportunities

        type: object

        list: true

        fields:

          - name: number

            type: string

          - name: title

            type: string

          - name: text

            type: text

      - name: approach

        label: Approach

        type: object

        fields:

          - name: label

            type: string

          - name: title

            type: string

          - name: steps

            type: object

            list: true

            fields:

              - name: title

                type: string

              - name: text

                type: text

      - name: expertise

        label: Local Expertise

        type: object

        fields:

          - name: label

            type: string

          - name: title

            type: string

          - name: paragraphs

            type: text

            list: true

          - name: image

            type: image

      - name: manifest

        label: Manifesto

        type: object

        fields:

          - name: title

            type: string

          - name: paragraphs

            type: text

            list: true

          - name: signature

            type: string

      - name: contact

        label: Contact

        type: object

        fields:

          - name: title

            type: string

          - name: text

            type: text

          - name: email

            type: string

          - name: instagram

            label: Instagram URL

            type: string

  - name: places

    label: Places

    type: group

    items:

      - name: tarifa

        label: Tarifa

        type: file

        path: tarifa.json

        format: json

        fields: &place_fields

          - name: slug

            type: string

          - name: name

            type: string

          - name: subtitle

            type: string

          - name: image

            type: image

          - name: intro

            type: text

          - name: published

            type: boolean

      - name: algarve

        label: Algarve

        type: file

        path: algarve.json

        format: json

        fields: *place_fields

      - name: morocco

        label: Morocco

        type: file

        path: morocco.json

        format: json

        fields: *place_fields

      - name: costa-rica

        label: Costa Rica

        type: file

        path: costa-rica.json

        format: json

        fields: *place_fields

  - name: journal

    label: Journal

    type: group

    items:

      - name: welcome

        label: Example Article

        type: file

        path: welcome.json

        format: json

        fields:

          - name: title

            type: string

          - name: slug

            type: string

          - name: destination

            type: string

          - name: date

            type: date

          - name: cover

            type: image

          - name: excerpt

            type: text

          - name: published

            type: boolean

          - name: body

            type: rich-text