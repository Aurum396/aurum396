<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURUM396</title>
<meta name="description" content="Exceptional places, meaningful projects and tangible experiences in remarkable destinations.">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
:root{--ink:#24221e;--paper:#f3efe7;--muted:#777064;--line:#d4cdc0;--dark:#1c1d19}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300}a{color:inherit;text-decoration:none}img{width:100%;display:block;object-fit:cover}.serif{font-family:'Playfair Display',serif}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}.wrap{width:min(1180px,88vw);margin:auto}.hero{height:100svh;min-height:650px;color:white;position:relative;background:linear-gradient(90deg,rgba(0,0,0,.48),rgba(0,0,0,.08)),url('assets/hero-costa-rica.jpeg') center 56%/cover}.nav{height:88px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.brand{font-size:18px;letter-spacing:.16em;font-weight:500}.navlinks{display:flex;gap:30px;font-size:12px;letter-spacing:.08em}.hero-copy{position:absolute;left:6vw;bottom:11vh;max-width:850px}.hero h1{font:500 clamp(54px,8.2vw,122px)/.93 'Playfair Display',serif;letter-spacing:-.045em;margin:12px 0 25px}.hero p{font-size:16px;letter-spacing:.03em;max-width:520px;line-height:1.6}.explore{display:inline-block;margin-top:26px;font-size:11px;letter-spacing:.18em;border-bottom:1px solid rgba(255,255,255,.7);padding-bottom:7px}.section{padding:130px 0}.intro{display:grid;grid-template-columns:1fr 2fr;gap:7vw}.intro h2,.manifest h2{font:500 clamp(42px,5.5vw,78px)/1.05 'Playfair Display',serif;letter-spacing:-.035em;margin:0}.intro .body{max-width:650px;font-size:19px;line-height:1.7}.intro .body p:first-child{margin-top:0}.statement{padding:110px 0;background:var(--dark);color:#eee9df;text-align:center}.statement h2{font:500 clamp(48px,7vw,96px)/1 'Playfair Display',serif;margin:0 0 28px;letter-spacing:-.04em}.statement p{font:300 20px/1.7 'DM Sans';max-width:660px;margin:auto;color:#c8c2b7}.cards{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.card{padding:45px 35px 55px 0;border-bottom:1px solid var(--line);min-height:250px}.card+.card{padding-left:35px;border-left:1px solid var(--line)}.card .num{font-size:11px;color:var(--muted);letter-spacing:.15em}.card h3{font:500 31px/1.1 'Playfair Display',serif;margin:40px 0 16px}.card p{font-size:14px;line-height:1.7;color:#625d54}.journey{background:#ded7ca;padding:120px 0}.journey h2{font:500 clamp(42px,5vw,70px)/1.05 'Playfair Display',serif;margin:15px 0 70px;max-width:800px}.steps{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #aaa295}.step{padding:28px 15px 10px 0}.step span{font:500 22px 'Playfair Display',serif}.step small{display:block;margin-top:12px;line-height:1.5;color:#696258}.places-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:45px}.places-head h2{font:500 clamp(45px,5vw,72px) 'Playfair Display',serif;margin:0}.places{display:grid;grid-template-columns:1fr 1fr;gap:18px}.place{height:64vh;min-height:470px;position:relative;overflow:hidden;background:#555}.place img{height:100%;transition:transform 1s ease;filter:brightness(.84)}.place:hover img{transform:scale(1.025)}.place-name{position:absolute;left:28px;bottom:26px;color:white}.place-name strong{display:block;font:500 37px 'Playfair Display',serif}.place-name small{font-size:11px;letter-spacing:.14em;text-transform:uppercase}.expertise{display:grid;grid-template-columns:1.1fr .9fr;gap:8vw;align-items:center}.expertise h2{font:500 clamp(42px,5vw,72px)/1.03 'Playfair Display',serif;margin:12px 0 30px}.expertise p{font-size:17px;line-height:1.75;color:#5c574e}.expertise img{height:650px}.manifest{text-align:center;max-width:930px;margin:auto}.manifest p{font-size:18px;line-height:1.75;max-width:700px;margin:30px auto;color:#625d54}.manifest .mini{margin-top:55px;font:italic 500 25px 'Playfair Display',serif;color:var(--ink)}.contact{background:#25241f;color:#eee9df;padding:130px 0 80px}.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:9vw}.contact h2{font:500 clamp(52px,6vw,88px)/1 'Playfair Display',serif;margin:10px 0 30px}.contact p{color:#bbb4a8;line-height:1.7}.form{padding-top:15px}.field{border-bottom:1px solid #625e56;padding:18px 0;margin-bottom:12px}.field input,.field textarea{width:100%;border:0;background:transparent;color:white;font:300 15px 'DM Sans';outline:none}.field textarea{height:80px;resize:none}.send{margin-top:28px;background:transparent;color:white;border:1px solid #8d887f;padding:15px 25px;letter-spacing:.14em;font-size:10px;text-transform:uppercase}.footer{display:flex;justify-content:space-between;border-top:1px solid #44423d;margin-top:90px;padding-top:28px;font-size:10px;letter-spacing:.12em;color:#88837a}.reveal{opacity:0;transform:translateY(22px);transition:.8s ease}.reveal.visible{opacity:1;transform:none}@media(max-width:760px){.navlinks{display:none}.hero-copy{left:7vw;right:7vw}.hero h1{font-size:58px}.section{padding:85px 0}.intro,.expertise,.contact-grid{grid-template-columns:1fr}.intro{gap:35px}.cards{grid-template-columns:1fr}.card+.card{padding-left:0;border-left:0}.steps{grid-template-columns:1fr 1fr}.places{grid-template-columns:1fr}.place{height:58vh}.expertise img{height:460px;order:-1}.footer{gap:20px;flex-direction:column}}
</style>
</head>
<body>
<header class="hero" id="top">
  <div class="wrap nav"><a class="brand" href="#top" data-brand>AURUM396</a>
  <nav class="navlinks"><a href="#opportunities">OPPORTUNITIES</a><a href="#places">PLACES</a><a href="#approach">APPROACH</a><a href="#contact">CONTACT</a></nav></div>
  <div class="hero-copy"><div class="eyebrow" id="hero-eyebrow"></div><h1><span id="hero-title"></span><br><em id="hero-emphasis"></em></h1><p id="hero-text"></p><a class="explore" href="#philosophy">EXPLORE ↓</a></div>
</header>
<main>
<section class="section" id="philosophy"><div class="wrap intro reveal"><div class="eyebrow" id="idea-label"></div><div><h2 id="idea-title"></h2><div class="body" id="idea-body"></div></div></div></section>
<section class="statement"><div class="wrap reveal"><div class="eyebrow" id="statement-label"></div><h2><span id="statement-title"></span><br><em id="statement-emphasis"></em></h2><p id="statement-text"></p></div></section>
<section class="section" id="opportunities"><div class="wrap"><div class="places-head reveal"><div><div class="eyebrow">OPPORTUNITIES</div><h2>Projects with possibility.</h2></div></div><div class="cards reveal" id="opportunity-cards"></div></div></section>
<section class="journey" id="approach"><div class="wrap reveal"><div class="eyebrow" id="approach-label"></div><h2 id="approach-title"></h2><div class="steps" id="approach-steps"></div></div></section>
<section class="section" id="places"><div class="wrap"><div class="places-head reveal"><div><div class="eyebrow">PLACES</div><h2>Where we look.</h2></div><p>Remarkable places with<br>character and possibility.</p></div><div class="places reveal" id="places-grid"></div></div></section>
<section class="section"><div class="wrap expertise reveal"><div><div class="eyebrow" id="expertise-label"></div><h2 id="expertise-title"></h2><div id="expertise-body"></div></div><img id="expertise-image" alt="Aurum396 local expertise"></div></section>
<section class="section"><div class="wrap manifest reveal"><div class="eyebrow">AURUM396</div><h2 id="manifest-title"></h2><div id="manifest-body"></div><div class="mini" id="manifest-signature"></div></div></section>
</main>
<footer class="contact" id="contact"><div class="wrap"><div class="contact-grid reveal"><div><div class="eyebrow">START A CONVERSATION</div><h2 id="contact-title"></h2><p id="contact-text"></p><p id="instagram-link"></p></div><form class="form" id="contact-form" method="post" enctype="text/plain"><div class="field"><input name="name" placeholder="Name"></div><div class="field"><input type="email" name="email" placeholder="Email"></div><div class="field"><textarea name="message" placeholder="Tell us about your project"></textarea></div><button class="send" type="submit">SEND INQUIRY →</button></form></div><div class="footer"><span>© 2026 AURUM396</span><span>EXCEPTIONAL PLACES · MEANINGFUL PROJECTS</span></div></div></footer>
<script>
const placeFiles=['tarifa','algarve','morocco','costa-rica'];
const p=(t)=>{const e=document.createElement('p');e.textContent=t;return e};
async function load(){
 const s=await fetch('content/site.json').then(r=>r.json());
 document.querySelectorAll('[data-brand]').forEach(e=>e.textContent=s.brand);
 document.getElementById('hero-eyebrow').textContent=s.hero.eyebrow;
 document.getElementById('hero-title').textContent=s.hero.title;
 document.getElementById('hero-emphasis').textContent=s.hero.emphasis;
 document.getElementById('hero-text').textContent=s.hero.text;
 document.querySelector('.hero').style.backgroundImage=`linear-gradient(90deg,rgba(0,0,0,.48),rgba(0,0,0,.08)),url('${s.hero.image}')`;
 document.getElementById('idea-label').textContent=s.idea.label; document.getElementById('idea-title').textContent=s.idea.title;
 s.idea.paragraphs.forEach(x=>document.getElementById('idea-body').appendChild(p(x)));
 document.getElementById('statement-label').textContent=s.statement.label; document.getElementById('statement-title').textContent=s.statement.title; document.getElementById('statement-emphasis').textContent=s.statement.emphasis; document.getElementById('statement-text').textContent=s.statement.text;
 document.getElementById('opportunity-cards').innerHTML=s.opportunities.map(o=>`<article class="card"><div class="num">${o.number}</div><h3>${o.title}</h3><p>${o.text}</p></article>`).join('');
 document.getElementById('approach-label').textContent=s.approach.label; document.getElementById('approach-title').textContent=s.approach.title;
 document.getElementById('approach-steps').innerHTML=s.approach.steps.map(x=>`<div class="step"><span>${x.title}</span><small>${x.text}</small></div>`).join('');
 const places=await Promise.all(placeFiles.map(slug=>fetch(`content/places/${slug}.json`).then(r=>r.json())));
 document.getElementById('places-grid').innerHTML=places.filter(x=>x.published).map(x=>`<div class="place"><img src="${x.image}" alt="${x.name}"><div class="place-name"><strong>${x.name}</strong><small>${x.subtitle}</small></div></div>`).join('');
 document.getElementById('expertise-label').textContent=s.expertise.label; document.getElementById('expertise-title').textContent=s.expertise.title; s.expertise.paragraphs.forEach(x=>document.getElementById('expertise-body').appendChild(p(x))); document.getElementById('expertise-image').src=s.expertise.image;
 document.getElementById('manifest-title').textContent=s.manifest.title; s.manifest.paragraphs.forEach(x=>document.getElementById('manifest-body').appendChild(p(x))); document.getElementById('manifest-signature').textContent=s.manifest.signature;
 document.getElementById('contact-title').textContent=s.contact.title; document.getElementById('contact-text').textContent=s.contact.text; document.getElementById('contact-form').action='mailto:'+s.contact.email;
 if(s.contact.instagram) document.getElementById('instagram-link').innerHTML=`<a href="${s.contact.instagram}" target="_blank" rel="noopener">Instagram ↗</a>`;
}
load();
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body></html>
